name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MCPal.sln

      - name: Build
        run: dotnet build MCPal.sln --configuration Release --no-restore

      # Cloud and E2E tests start PostgreSQL through Testcontainers; the hosted runner provides Docker.
      - name: Test
        run: >
          dotnet test MCPal.sln --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  web:
    name: Web portal typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/MCPal.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MCPal.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  e2e:
    name: Browser smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/MCPal.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MCPal.Web/package-lock.json

      # The production stack: cloud (with the built SPA) and PostgreSQL.
      - name: Start the stack
        working-directory: .
        run: docker compose up --build -d

      - name: Wait for the cloud to be ready
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/health/ready > /dev/null; then
              echo "ready after $attempt attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "the cloud did not become ready" >&2
          docker compose --project-directory ../.. logs cloud
          exit 1

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Test the Linux install script
        working-directory: .
        run: packaging/linux/test-install.sh

      - name: Run the smoke tests
        run: npx playwright test

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/MCPal.Web/playwright-report
            src/MCPal.Web/test-results

      - name: Show the cloud log
        if: failure()
        working-directory: .
        run: docker compose logs cloud

      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down --volumes
